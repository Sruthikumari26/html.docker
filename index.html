<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Eesha! 🎉</title>
    <!-- Confetti library for extra magic -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0c2a 0%, #1b1b4b 40%, #2a1e5c 100%);
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        /* floating stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: twinkle 3s infinite ease-in-out;
            box-shadow: 0 0 12px #fff9c4, 0 0 20px #ffe082;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* main card */
        .birthday-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 70px 70px 70px 70px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 4px rgba(255, 215, 0, 0.2), 0 0 40px #ffb347;
            padding: 3rem 2.5rem;
            max-width: 800px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
            animation: float 5s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-12px); }
        }

        /* Eesha name with gradient */
        .name-glow {
            font-size: clamp(3.8rem, 15vw, 6.5rem);
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffe066, #ffb347, #ff6f61, #ffb347, #ffe066);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-stroke: 3px rgba(255, 255, 200, 0.3);
            text-shadow: 0 0 30px #ffb347, 0 0 60px #ff6f61, 0 0 100px #ffb347;
            animation: shimmer 3s infinite alternate, pulseGlow 2s infinite;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            filter: drop-shadow(0 8px 12px black);
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 20px gold); }
            50% { filter: drop-shadow(0 0 40px #ffaa33); }
        }

        .birthday-wish {
            font-size: clamp(1.5rem, 6vw, 2.8rem);
            color: #fff9e6;
            text-shadow: 0 0 20px #ffaa33, 0 0 40px #ff6f61;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            animation: softPop 2s infinite alternate;
        }

        @keyframes softPop {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        /* interactive message button */
        .magic-btn {
            background: radial-gradient(circle at 30% 20%, #ffdf80, #ffb347);
            border: none;
            border-radius: 60px;
            padding: 18px 40px;
            font-size: 1.8rem;
            font-weight: bold;
            color: #1e1e3f;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
            box-shadow: 0 12px 0 #9b5e2e, 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 30px #ffd966;
            cursor: pointer;
            transition: all 0.1s ease;
            margin: 25px 0 15px;
            letter-spacing: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            border: 2px solid #fff3c9;
            transform: translateY(0);
        }

        .magic-btn:active {
            transform: translateY(8px);
            box-shadow: 0 4px 0 #9b5e2e, 0 10px 20px black, 0 0 40px #ffb347;
        }

        .magic-btn i {
            font-size: 2rem;
            filter: drop-shadow(0 0 6px gold);
        }

        /* interactive message display */
        .message-box {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            padding: 1.8rem;
            margin: 1.5rem 0 0.5rem;
            border: 1px solid rgba(255, 215, 0, 0.5);
            box-shadow: inset 0 0 30px rgba(255, 200, 0, 0.2), 0 10px 25px rgba(0, 0, 0, 0.3);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .message-text {
            font-size: 1.5rem;
            color: #fff0d0;
            font-weight: 500;
            line-height: 1.5;
            text-shadow: 0 0 12px #ffbb33;
            transition: opacity 0.2s;
            word-break: break-word;
            padding: 5px;
        }

        /* emoji rain effect using canvas confetti is separate, but we add balloons floating */
        .balloon {
            position: fixed;
            bottom: -150px;
            font-size: 4rem;
            opacity: 0.8;
            animation: riseUp 10s linear infinite;
            z-index: 2;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.7));
        }

        @keyframes riseUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-120vh) rotate(15deg); opacity: 0; }
        }

        /* cake interactive part */
        .cake-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .cake-emoji {
            font-size: 4rem;
            filter: drop-shadow(0 0 15px gold);
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .cake-emoji:active {
            transform: scale(1.3);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .candle-blow {
            font-size: 1.2rem;
            color: #ffe8b0;
            margin-top: 5px;
            opacity: 0.9;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 30px;
        }

        /* responsive */
        @media (max-width: 550px) {
            .birthday-card {
                padding: 2rem 1.2rem;
                border-radius: 50px;
            }
            .magic-btn {
                font-size: 1.3rem;
                padding: 14px 25px;
            }
            .message-text {
                font-size: 1.2rem;
            }
        }

        /* extra sparkle cursor */
        .sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 1.8rem;
            z-index: 999;
            animation: fadeOut 1s forwards;
            opacity: 1;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(2); }
        }
    </style>
</head>
<body>
    <!-- Floating balloons -->
    <div class="balloon" style="left: 5%; animation-duration: 8s;">🎈</div>
    <div class="balloon" style="left: 20%; animation-duration: 12s; animation-delay: 2s;">🎈</div>
    <div class="balloon" style="left: 75%; animation-duration: 10s; animation-delay: 1s;">🎈</div>
    <div class="balloon" style="left: 90%; animation-duration: 14s; animation-delay: 0s;">🎈</div>
    <div class="balloon" style="left: 45%; animation-duration: 9s; animation-delay: 3s;">🎈</div>
    <div class="balloon" style="left: 60%; animation-duration: 11s; animation-delay: 2.5s;">🎈</div>

    <!-- Twinkling stars background -->
    <div class="stars" id="starsContainer"></div>

    <!-- Main birthday card -->
    <div class="birthday-card" id="mainCard">
        <div class="name-glow">Eesha</div>
        <div class="birthday-wish">✨ Happy Birthday! ✨</div>

        <!-- Cake & candle interactive -->
        <div class="cake-section">
            <div class="cake-emoji" id="cakeClick" title="Click the cake!">🎂</div>
            <div class="candle-blow" id="candleHint">🕯️ tap the cake 🕯️</div>
        </div>

        <!-- Interactive button to show different wishes -->
        <button class="magic-btn" id="wishButton">
            <span>🎁</span> Surprise Wish <span>🎁</span>
        </button>

        <!-- Message box -->
        <div class="message-box" id="messageBox">
            <div class="message-text" id="messageText">You are my sunshine, Eesha! ☀️</div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- CREATE STARS ----------
            const starsContainer = document.getElementById('starsContainer');
            const starCount = 90;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 5 + 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starsContainer.appendChild(star);
            }

            // ---------- ELEMENTS ----------
            const wishButton = document.getElementById('wishButton');
            const messageText = document.getElementById('messageText');
            const cakeClick = document.getElementById('cakeClick');
            const candleHint = document.getElementById('candleHint');
            const mainCard = document.getElementById('mainCard');

            // messages array – sweet, fun, personalized for Eesha
            const wishes = [
                "🎉 Eesha, you make the world brighter! 🎉",
                "🌟 Happy Birthday to the sweetest girl ever! 🌟",
                "🧁 May your day be full of cake, laughter & magic! 🧁",
                "🌈 Eesha, you're a rainbow in our lives! 🌈",
                "🦄 Wishing you unicorn dreams & fairy tale wishes! 🦄",
                "💖 You are loved more than you know, Eesha! 💖",
                "🍭 Sweetest daughter, happiest birthday! 🍭",
                "✨ Keep shining, keep smiling, keep being you! ✨",
                "🎈 Another year of awesome adventures awaits! 🎈",
                "🐼 You're panda-mazing, Eesha! 🐼"
            ];

            // Current message index
            let msgIndex = 0;
            // Set initial message
            messageText.textContent = wishes[0];

            // ---------- INTERACTIVE BUTTON: SHOW NEW WISH + CONFETTI ----------
            wishButton.addEventListener('click', function(e) {
                e.preventDefault();
                // cycle messages
                msgIndex = (msgIndex + 1) % wishes.length;
                messageText.textContent = wishes[msgIndex];

                // Add a little animation to message
                messageText.style.transform = 'scale(1.1)';
                setTimeout(() => messageText.style.transform = 'scale(1)', 150);

                // Confetti burst from button
                const rect = wishButton.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;

                // primary burst
                confetti({
                    particleCount: 80,
                    spread: 90,
                    origin: { x: x, y: y },
                    colors: ['#FFD966', '#FFB347', '#FF6F61', '#FFA07A', '#FFFACD', '#FF69B4']
                });

                // a few extra bursts for joy
                setTimeout(() => {
                    confetti({
                        particleCount: 40,
                        spread: 60,
                        origin: { x: 0.2, y: 0.7 },
                        colors: ['#FFD700', '#FFB6C1', '#FFA500']
                    });
                }, 150);
                setTimeout(() => {
                    confetti({
                        particleCount: 40,
                        spread: 60,
                        origin: { x: 0.8, y: 0.7 },
                        colors: ['#FFD700', '#FFB6C1', '#FFA500']
                    });
                }, 300);

                // also sparkle around card
                createSparkleBurst();
            });

            // ---------- CAKE INTERACTIVE: BLOW CANDLE + CONFETTI + MESSAGE ----------
            cakeClick.addEventListener('click', function() {
                // Blow out candle effect
                candleHint.textContent = '💨 Whoosh! Wish made! 💨';
                cakeClick.style.transform = 'scale(1.4) rotate(5deg)';
                setTimeout(() => cakeClick.style.transform = 'scale(1) rotate(0deg)', 300);

                // change cake emoji momentarily to blown candle? we could swap but keep cute
                cakeClick.textContent = '🍰';
                setTimeout(() => cakeClick.textContent = '🎂', 600);

                // show a special wish in message
                messageText.textContent = '🌟 Your wish is coming true, Eesha! 🌟';

                // Confetti blow effect from cake
                const rect = cakeClick.getBoundingClientRect();
                const cakeX = (rect.left + rect.width / 2) / window.innerWidth;
                const cakeY = (rect.top + rect.height / 2) / window.innerHeight;

                confetti({
                    particleCount: 100,
                    spread: 100,
                    origin: { x: cakeX, y: cakeY },
                    colors: ['#FFC0CB', '#FFD700', '#FF6347', '#FFA500', '#FFF8DC'],
                    startVelocity: 25,
                    scalar: 1.2
                });

                // extra tiny confetti from sides
                setTimeout(() => {
                    confetti({
                        particleCount: 30,
                        spread: 70,
                        origin: { x: 0.3, y: 0.8 },
                        colors: ['#FFD700', '#FF1493']
                    });
                }, 200);

                // Reset hint after 2 seconds
                setTimeout(() => {
                    candleHint.textContent = '🕯️ tap the cake 🕯️';
                }, 2000);

                // Make the card do a little happy wiggle
                mainCard.style.transform = 'rotate(1deg) scale(1.01)';
                setTimeout(() => mainCard.style.transform = 'rotate(0deg) scale(1)', 200);
            });

            // ---------- SPARKLE BURST FUNCTION (creates small emoji sparkles) ----------
            function createSparkleBurst() {
                for (let i = 0; i < 12; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.textContent = ['✨', '⭐', '🌟', '💫', '🎉', '💖'][Math.floor(Math.random() * 6)];
                    sparkle.style.left = Math.random() * 100 + 'vw';
                    sparkle.style.top = Math.random() * 100 + 'vh';
                    sparkle.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    sparkle.style.position = 'fixed';
                    sparkle.style.pointerEvents = 'none';
                    sparkle.style.zIndex = '9999';
                    sparkle.style.animation = 'fadeOut 1s forwards';
                    document.body.appendChild(sparkle);

                    setTimeout(() => {
                        sparkle.remove();
                    }, 1000);
                }
            }

            // ---------- INITIAL CONFETTI WHEN PAGE LOADS (a small welcome) ----------
            window.addEventListener('load', () => {
                // slight delay so it doesn't block rendering
                setTimeout(() => {
                    confetti({
                        particleCount: 150,
                        spread: 100,
                        origin: { y: 0.6 },
                        colors: ['#FFD966', '#FFB347', '#FF6F61', '#FFA07A', '#FF69B4', '#FFFACD']
                    });
                    // second burst
                    setTimeout(() => {
                        confetti({
                            particleCount: 80,
                            spread: 120,
                            origin: { y: 0.5, x: 0.3 },
                            colors: ['#FFD700', '#FF1493', '#FFA500']
                        });
                        confetti({
                            particleCount: 80,
                            spread: 120,
                            origin: { y: 0.5, x: 0.7 },
                            colors: ['#FFD700', '#FF1493', '#FFA500']
                        });
                    }, 300);
                }, 400);
            });

            // ---------- EXTRA CURSOR SPARKLES (whenever mouse moves over card) ----------
            mainCard.addEventListener('mousemove', (e) => {
                if (Math.random() < 0.15) { // throttle
                    const spark = document.createElement('div');
                    spark.className = 'sparkle';
                    spark.textContent = '✨';
                    spark.style.left = e.clientX + 'px';
                    spark.style.top = e.clientY + 'px';
                    spark.style.fontSize = '20px';
                    spark.style.animation = 'fadeOut 0.8s forwards';
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 800);
                }
            });

            // Also sparkle on button hover
            wishButton.addEventListener('mouseenter', () => {
                createSparkleBurst();
                // small confetti pop
                confetti({
                    particleCount: 30,
                    spread: 50,
                    origin: { y: 0.7 },
                    colors: ['#FFD700', '#FFB6C1']
                });
            });

            // Extra: double click anywhere for confetti (fun!)
            document.body.addEventListener('dblclick', (e) => {
                confetti({
                    particleCount: 120,
                    spread: 90,
                    origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight },
                    colors: ['#FFD966', '#FF6F61', '#FFB347', '#FF69B4', '#FFFACD']
                });
                createSparkleBurst();
            });

            // Keep sparkle creation function accessible
            window.createSparkleBurst = createSparkleBurst;
        })();
    </script>
    <!-- Small note: confetti library loaded at top -->
</body>
</html>
